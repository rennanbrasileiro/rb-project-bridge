<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RB Project Bridge</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header><img src="../assets/icon.png" alt=""><div><h1>RB Project Bridge</h1><p>Base44 → auditoria → GitHub</p></div></header>
    <section class="card">
      <h2>1. Conectar contas</h2>
      <div class="row"><button id="base44Login">Conectar Base44</button><span id="base44Status">Não conectado</span></div>
      <div class="row"><button id="githubLogin">Conectar GitHub</button><span id="githubStatus">Não conectado</span></div>
      <div id="githubAuthBox" class="auth-box hidden" aria-live="polite">
        <div>
          <strong>Autorize o GitHub no navegador</strong>
          <p>Use este código de uso único:</p>
          <code id="githubDeviceCode">—</code>
        </div>
        <div class="row auth-actions">
          <button id="copyGitHubCode" type="button">Copiar código</button>
          <button id="openGitHubDevice" type="button">Abrir autorização</button>
        </div>
      </div>
      <div id="base44AuthBox" class="auth-box hidden" aria-live="polite">
        <strong>Autorização Base44 aberta no navegador.</strong>
        <p>Conclua o login e volte ao aplicativo.</p>
      </div>
    </section>
    <section class="card"><h2>2. Projeto e destino</h2><label>Projeto Base44<select id="project"></select></label><label>Pasta de entrega<div class="row"><input id="output" readonly><button id="chooseOutput">Selecionar</button></div></label></section>
    <section class="card"><h2>3. Repositório</h2><label>Conta GitHub<select id="owner"></select></label><label>Nome<input id="repoName" placeholder="agilehub"></label><label>Descrição<input id="description"></label><label><input type="checkbox" id="publicRepo"> Repositório público</label><label><input type="checkbox" id="buildValidation"> Validar build em cópia isolada</label><label><input type="checkbox" id="authorization"> Tenho autorização do proprietário</label></section>
    <section class="card"><h2>4. Executar</h2><div class="row"><button id="start" class="primary">Iniciar migração</button><button id="cancel">Cancelar</button></div><pre id="log"></pre><div id="result"></div></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
