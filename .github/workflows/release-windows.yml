name: Build and publish Windows release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run validation and 19 automated tests
        run: npm run check

      - name: Build Setup and Portable executables
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Generate SHA-256 files
        shell: pwsh
        run: |
          Get-ChildItem -Path release -Filter '*.exe' | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content -NoNewline "$($_.FullName).sha256"
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: rb-project-bridge-windows-0.1.1
          path: |
            release/*.exe
            release/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.1-rc1
          name: RB Project Bridge 0.1.1 RC1
          body: |
            Windows release candidate generated automatically from the validated source.

            Validation performed:
            - source smoke check
            - syntax checks
            - 19 automated tests
            - Windows Setup and Portable builds
            - SHA-256 generation

            The executables are not digitally signed yet and Windows SmartScreen may display a warning.
          prerelease: true
          draft: false
          files: |
            release/*.exe
            release/*.sha256

      - name: Record successful build on main
        uses: actions/github-script@v7
        with:
          script: |
            const body = `# Windows build successful

            - Version: 0.1.1 RC1
            - Source commit: ${context.sha}
            - Workflow run: ${context.runId}
            - Validation: 19 automated tests passed
            - Outputs: Setup and Portable executables with SHA-256 files
            - Release tag: v0.1.1-rc1
            `;
            const content = Buffer.from(body, 'utf8').toString('base64');
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'BUILD_SUCCESS.md',
              message: 'Record successful Windows build [skip ci]',
              content,
              branch: 'main'
            };
            try {
              const current = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'BUILD_SUCCESS.md',
                ref: 'main'
              });
              params.sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents(params);
