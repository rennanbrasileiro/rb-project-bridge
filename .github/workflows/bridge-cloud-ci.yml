name: Bridge Cloud CI

on:
  pull_request:
    paths:
      - 'cloud/**'
      - 'electron/**'
      - 'tests/**'
      - 'package.json'
      - 'Dockerfile.cloud'
      - '.github/workflows/bridge-cloud-ci.yml'
  push:
    branches:
      - 'feat/bridge-cloud-v0.6'
    paths:
      - 'cloud/**'
      - 'electron/**'
      - 'tests/**'
      - 'package.json'
      - 'Dockerfile.cloud'
      - '.github/workflows/bridge-cloud-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax and automated tests
        run: npm run check
      - name: Build Bridge Cloud image
        run: docker build -f Dockerfile.cloud -t rb-project-bridge-cloud:ci .
