name: Restore source and publish RC1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reassemble and verify source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $parts = Get-ChildItem 'bootstrap/source.fixed.*.b64' | Sort-Object Name
          if ($parts.Count -ne 17) {
            throw "Expected 17 fixed source parts, found $($parts.Count)."
          }

          $encoded = ($parts | ForEach-Object {
            [IO.File]::ReadAllText($_.FullName).Trim()
          }) -join ''

          [IO.File]::WriteAllBytes(
            'source.zip',
            [Convert]::FromBase64String($encoded)
          )

          $expected = 'eecd1a2523b210e9682e757b8b2994f3189c2c22b8604c613c70e0627aeae1e2'
          $actual = (Get-FileHash 'source.zip' -Algorithm SHA256).Hash.ToLowerInvariant()

          if ($actual -ne $expected) {
            throw "Source checksum mismatch. Expected $expected, received $actual."
          }

          New-Item -ItemType Directory -Path 'extracted' -Force | Out-Null
          Expand-Archive 'source.zip' 'extracted' -Force

          $sourceRoot = Join-Path $PWD 'extracted/rb-project-bridge-0.1.1'
          if (-not (Test-Path (Join-Path $sourceRoot 'package.json'))) {
            throw 'The source package does not contain the expected project root.'
          }

          robocopy $sourceRoot $PWD /E /NFL /NDL /NJH /NJS /NP
          $copyExit = $LASTEXITCODE
          $global:LASTEXITCODE = 0

          if ($copyExit -ge 8) {
            throw "Source copy failed with robocopy exit code $copyExit."
          }

          Remove-Item 'bootstrap', 'extracted', 'source.zip' -Recurse -Force
          Remove-Item '.github/workflows/bootstrap.yml' -Force
          Remove-Item '.github/workflows/promote-clean-source.yml' -Force -ErrorAction SilentlyContinue
          Remove-Item '.github/workflows/release.yml' -Force -ErrorAction SilentlyContinue

      - name: Commit clean source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish RB Project Bridge 0.1.1 source'
          git push origin main
          "RELEASE_COMMIT=$(git rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate source
        run: npm run check

      - name: Build Windows applications
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem release -File |
            Where-Object { $_.Extension -eq '.exe' } |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } |
            Set-Content release/SHA256SUMS.txt -Encoding utf8

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rb-project-bridge-windows
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish RC1 release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.1.1-rc1
          target_commitish: ${{ env.RELEASE_COMMIT }}
          name: RB Project Bridge 0.1.1 RC1
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/RB-Project-Bridge-Setup-0.1.1-x64.exe
            release/RB-Project-Bridge-Portable-0.1.1-x64.exe
            release/SHA256SUMS.txt
