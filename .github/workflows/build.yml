name: Build and release desktop application

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check

  windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify Base44 runner in unpacked and portable applications
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $executables = @(
            (Resolve-Path 'release/win-unpacked/RB Project Bridge.exe'),
            (Resolve-Path 'release/RB-Project-Bridge-Portable-0.1.4-x64.exe')
          )
          foreach ($exe in $executables) {
            Write-Host "Testing $exe"
            $process = Start-Process -FilePath $exe -ArgumentList '--smoke-base44-cli' -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              throw "Base44 smoke test failed for $exe with exit code $($process.ExitCode)."
            }
          }
      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem release -File | Where-Object { $_.Extension -eq '.exe' } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content release/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: rb-project-bridge-windows-0.1.4
          path: release/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish 0.1.4 RC1 release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.1.4-rc1
          target_commitish: main
          name: RB Project Bridge 0.1.4 RC1
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/RB-Project-Bridge-Setup-0.1.4-x64.exe
            release/RB-Project-Bridge-Portable-0.1.4-x64.exe
            release/SHA256SUMS.txt
