name: Build and release desktop application

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check

  windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify packaged Base44 CLI
        shell: pwsh
        run: |
          $app = Resolve-Path 'release/win-unpacked/RB Project Bridge.exe'
          $cli = Resolve-Path 'release/win-unpacked/resources/app.asar.unpacked/node_modules/base44/bin/run.js'
          $assets = Resolve-Path 'release/win-unpacked/resources/app.asar.unpacked/node_modules/base44/dist/assets'
          if (-not (Test-Path $assets)) { throw 'Bundled Base44 assets are missing.' }
          $env:ELECTRON_RUN_AS_NODE = '1'
          & $app $cli --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled Base44 CLI failed with exit code $LASTEXITCODE." }
      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem release -File | Where-Object { $_.Extension -eq '.exe' } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content release/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: rb-project-bridge-windows-0.1.2
          path: release/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish 0.1.2 RC1 release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.1.2-rc1
          target_commitish: ${{ github.sha }}
          name: RB Project Bridge 0.1.2 RC1
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/RB-Project-Bridge-Setup-0.1.2-x64.exe
            release/RB-Project-Bridge-Portable-0.1.2-x64.exe
            release/SHA256SUMS.txt
