name: Build and release desktop application

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/fix-standalone-gate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-standalone-gate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply standalone gate correction
        run: python scripts/patch-standalone-gate.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add electron/services/standalone-service.cjs tests/standalone.test.cjs renderer/app.js
          if git diff --cached --quiet; then
            echo 'Patch already applied.'
          else
            git commit -m 'Fix standalone gate false positive for archived Base44 sources'
            git push origin HEAD:agent/fix-standalone-gate
          fi

  validate:
    needs: patch
    if: always() && needs.patch.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-standalone-gate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --loglevel=error
      - run: npm run check

  windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-standalone-gate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --loglevel=error
      - run: npm run check
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify direct Base44 OAuth in packaged application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:RB_BRIDGE_SMOKE_BASE44_OAUTH = '1'
          $marker = Join-Path $env:RUNNER_TEMP 'base44-oauth.json'
          $env:RB_BRIDGE_SMOKE_MARKER = $marker
          $process = Start-Process -FilePath (Resolve-Path 'release/RB-Project-Bridge-Portable-0.2.1-x64.exe') -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path $marker)) { throw 'Packaged OAuth smoke failed.' }
          $proof = Get-Content $marker -Raw | ConvertFrom-Json
          if (-not $proof.ok -or -not $proof.userCode -or $proof.verificationUri -notmatch '^https://([^/]+\.)?base44\.com/') { throw 'Invalid Base44 OAuth proof.' }
      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem release -File | Where-Object { $_.Extension -eq '.exe' } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content release/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: rb-project-bridge-windows-0.2.1-gate-fix
          path: release/*
          if-no-files-found: error
          retention-days: 30
