name: FitHub standalone diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/fix-base44-export-network'
    runs-on: ubuntu-latest
    steps:
      - name: Reproduce FitHub conversion and build
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch agent/fix-base44-export-network https://github.com/rennanbrasileiro/rb-project-bridge.git bridge
          git clone --depth 1 https://github.com/rennanbrasileiro/fithub.git fithub
          cd bridge
          npm install --no-audit --no-fund --loglevel=error
          cd ..
          node - <<'NODE'
          const { StandaloneService } = require('./bridge/electron/services/standalone-service.cjs');
          const service = new StandaloneService({ logger: { info(){}, warn(){}, error(){} }, emit(){} });
          (async () => {
            const result = await service.transform('fithub', { projectName: 'FitHub Personal Trainer' });
            console.log('TRANSFORM_RESULT', JSON.stringify({ gate: result.gate, entities: result.entities.length, functions: result.functions.length }));
            if (!result.gate?.passed) throw new Error('Standalone gate did not pass.');
          })().catch((error) => { console.error(error.stack || error); process.exit(1); });
          NODE
          cd fithub
          npm install --no-audit --no-fund --loglevel=error
          npm run check:standalone
          npm run build:demo
          test -f dist/index.html
