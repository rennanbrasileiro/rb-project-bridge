name: Build and release desktop application

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/fix-base44-export-network'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-base44-export-network
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply resilience and repository intelligence patch
        shell: bash
        run: |
          if grep -q 'async listRepositories(owner' electron/services/github-service.cjs && grep -q '"version": "0.2.3"' package.json; then
            echo 'Patch already applied.'
          else
            sed -i "s#Path('.github/workflows/release.yml')#Path('.github/workflows/build.yml')#" scripts/apply-0.2.3-resilience.py
            python scripts/apply-0.2.3-resilience.py
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add electron renderer tests package.json .github/workflows/build.yml
            git commit -m 'Add resilient Base44 export and safe repository selection'
            git push origin HEAD:agent/fix-base44-export-network
          fi

  validate:
    needs: patch
    if: always() && needs.patch.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-base44-export-network
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --loglevel=error
      - run: npm run check

  windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-base44-export-network
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --loglevel=error
      - run: npm run check
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify direct Base44 OAuth in packaged application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:RB_BRIDGE_SMOKE_BASE44_OAUTH = '1'
          $marker = Join-Path $env:RUNNER_TEMP 'base44-oauth.json'
          $env:RB_BRIDGE_SMOKE_MARKER = $marker
          $process = Start-Process -FilePath (Resolve-Path 'release/RB-Project-Bridge-Portable-0.2.3-x64.exe') -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path $marker)) { throw 'Packaged OAuth smoke failed.' }
          $proof = Get-Content $marker -Raw | ConvertFrom-Json
          if (-not $proof.ok -or -not $proof.userCode -or $proof.verificationUri -notmatch '^https://([^/]+\.)?base44\.com/') { throw 'Invalid Base44 OAuth proof.' }
      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem release -File | Where-Object { $_.Extension -eq '.exe' } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content release/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: rb-project-bridge-windows-0.2.3
          path: release/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish 0.2.3 RC1 release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.2.3-rc1
          target_commitish: ${{ github.sha }}
          name: RB Project Bridge 0.2.3 RC1
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/RB-Project-Bridge-Setup-0.2.3-x64.exe
            release/RB-Project-Bridge-Portable-0.2.3-x64.exe
            release/SHA256SUMS.txt
