name: Apply and validate V2 standalone overlay

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/v2-standalone-supabase'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Rebuild verified V2 overlay
        shell: bash
        run: |
          set -euo pipefail
          cat .rb-v2/chunk-* > rb-v2-overlay.b64
          base64 --decode rb-v2-overlay.b64 > rb-v2-overlay.zip
          echo '23d6a25cf19cc173a35293c1f6ec0a4ac82cd7477f81db9d0ef4c8126aa871e1  rb-v2-overlay.zip' | sha256sum --check
          unzip -o rb-v2-overlay.zip -d .
          git checkout HEAD -- .github/workflows/build.yml
          rm -rf .rb-v2 rb-v2-overlay.b64 rb-v2-overlay.zip
          rm -f docs/V2_EXECUTION_MARKER.md
      - name: Commit exact V2 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'RB Project Bridge Bot'
          git config user.email 'rennanbrasileiro@users.noreply.github.com'
          git add -A
          git reset -- .github/workflows/build.yml .github/workflows/apply-v2-overlay.yml
          if git diff --cached --quiet; then
            echo 'No overlay changes to commit.'
          else
            git commit -m 'Implement modular standalone Supabase pipeline'
            git push origin HEAD:${{ github.head_ref }}
          fi

  validate:
    needs: apply
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-standalone-supabase
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Homologate complete FitHub conversion and local build
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/rennanbrasileiro/fithub.git fixture-fithub
          node - <<'NODE'
          const { StandaloneService } = require('./electron/services/standalone-service.cjs');
          const service = new StandaloneService({ logger: { info(){}, warn(){} }, emit(){} });
          service.transform('fixture-fithub', { projectName: 'FitHub Personal Trainer' })
            .then((result) => {
              console.log(JSON.stringify(result, null, 2));
              if (result.entitiesConverted < 20) throw new Error('FitHub entity conversion is incomplete.');
              if (!result.independence?.passed) throw new Error('Base44 runtime dependencies remain.');
            })
            .catch((error) => { console.error(error); process.exit(1); });
          NODE
          cd fixture-fithub
          npm install --no-audit --no-fund
          npm run check:standalone
          npm run build:demo
          test -f dist/index.html

  windows:
    needs: apply
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-standalone-supabase
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: rb-project-bridge-v2-windows
          path: release/*
          if-no-files-found: error
          retention-days: 30
