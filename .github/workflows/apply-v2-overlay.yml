name: Validate V2 standalone Supabase

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'agent/v2-standalone-supabase'
    runs-on: ubuntu-latest
    outputs:
      homologation_status: ${{ steps.homologate.outputs.status }}
      homologation_tail_b64: ${{ steps.homologate.outputs.tail_b64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-standalone-supabase
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Homologate complete FitHub conversion and local build
        id: homologate
        shell: bash
        run: |
          set +e
          LOG="$RUNNER_TEMP/homologation.log"
          {
            git clone --depth 1 --branch main https://github.com/rennanbrasileiro/fithub.git fixture-fithub
            node - <<'NODE'
            const { StandaloneService } = require('./electron/services/standalone-service.cjs');
            const service = new StandaloneService({ logger: { info(){}, warn(){} }, emit(){} });
            service.transform('fixture-fithub', { projectName: 'FitHub Personal Trainer' })
              .then((result) => {
                console.log(JSON.stringify(result, null, 2));
                if (result.entitiesConverted < 20) throw new Error('FitHub entity conversion is incomplete.');
                if (!result.independence?.passed) throw new Error('Base44 runtime dependencies remain.');
              })
              .catch((error) => { console.error(error); process.exit(1); });
            NODE
            cd fixture-fithub
            npm install --no-audit --no-fund
            npm run check:standalone
            npm run build:demo
            test -f dist/index.html
          } > "$LOG" 2>&1
          status=$?
          tail_b64="$(tail -n 30 "$LOG" | cut -c1-300 | base64 -w0)"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "tail_b64=$tail_b64" >> "$GITHUB_OUTPUT"
          echo "FitHub homologation exit code: $status"
          exit 0

  diagnostic:
    needs: validate
    if: always() && needs.validate.outputs.homologation_status != '0'
    runs-on: ubuntu-latest
    steps:
      - name: FitHub failure details
        env:
          DIAGNOSTIC_B64: ${{ needs.validate.outputs.homologation_tail_b64 }}
        run: |
          printf '%s' "$DIAGNOSTIC_B64" | base64 --decode
          printf '\n'
          exit 1

  windows:
    if: github.head_ref == 'agent/v2-standalone-supabase'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-standalone-supabase
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: rb-project-bridge-v2-windows
          path: release/*
          if-no-files-found: error
          retention-days: 30
