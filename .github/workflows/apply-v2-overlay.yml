name: Validate V2 standalone Supabase

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'agent/v2-standalone-supabase'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-standalone-supabase
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Homologate complete FitHub conversion and local build
        id: homologate
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -o pipefail
          LOG="$GITHUB_WORKSPACE/homologation.log"
          EXIT_FILE="$GITHUB_WORKSPACE/homologation.exit"
          {
            git clone --depth 1 --branch main https://github.com/rennanbrasileiro/fithub.git fixture-fithub
            node - <<'NODE'
            const { StandaloneService } = require('./electron/services/standalone-service.cjs');
            const service = new StandaloneService({ logger: { info(){}, warn(){} }, emit(){} });
            service.transform('fixture-fithub', { projectName: 'FitHub Personal Trainer' })
              .then((result) => {
                console.log(JSON.stringify(result, null, 2));
                if (result.entitiesConverted < 20) throw new Error('FitHub entity conversion is incomplete.');
                if (!result.independence?.passed) throw new Error('Base44 runtime dependencies remain.');
              })
              .catch((error) => { console.error(error); process.exit(1); });
            NODE
            cd fixture-fithub
            npm install --no-audit --no-fund
            npm run check:standalone
            npm run build:demo
            test -f dist/index.html
          } 2>&1 | tee "$LOG"
          status=${PIPESTATUS[0]}
          echo "$status" > "$EXIT_FILE"
          exit 0
      - name: Upload FitHub homologation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fithub-v2-homologation
          path: |
            homologation.log
            homologation.exit
            fixture-fithub/MIGRATION_REPORT.md
            fixture-fithub/MIGRATION_REPORT.json
          if-no-files-found: warn
          retention-days: 7
      - name: Enforce FitHub homologation result
        shell: bash
        run: |
          test -f homologation.exit
          test "$(cat homologation.exit)" = '0'

  windows:
    if: github.head_ref == 'agent/v2-standalone-supabase'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-standalone-supabase
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: rb-project-bridge-v2-windows
          path: release/*
          if-no-files-found: error
          retention-days: 30
