name: Validate V2 standalone Supabase

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'agent/v2-standalone-supabase'
    runs-on: ubuntu-latest
    outputs:
      homologation_status: ${{ steps.homologate.outputs.status }}
      homologation_tail: ${{ steps.homologate.outputs.tail }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-standalone-supabase
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Homologate complete FitHub conversion and local build
        id: homologate
        shell: bash
        run: |
          set +e
          LOG="$RUNNER_TEMP/homologation.log"
          {
            git clone --depth 1 --branch main https://github.com/rennanbrasileiro/fithub.git fixture-fithub
            node - <<'NODE'
            const { StandaloneService } = require('./electron/services/standalone-service.cjs');
            const service = new StandaloneService({ logger: { info(){}, warn(){} }, emit(){} });
            service.transform('fixture-fithub', { projectName: 'FitHub Personal Trainer' })
              .then((result) => {
                console.log(JSON.stringify(result, null, 2));
                if (result.entitiesConverted < 20) throw new Error('FitHub entity conversion is incomplete.');
                if (!result.independence?.passed) throw new Error('Base44 runtime dependencies remain.');
              })
              .catch((error) => { console.error(error); process.exit(1); });
            NODE
            cd fixture-fithub
            npm install --no-audit --no-fund
            npm run check:standalone
            npm run build:demo
            test -f dist/index.html
          } > "$LOG" 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          {
            echo 'tail<<RB_DIAGNOSTIC_EOF'
            tail -n 45 "$LOG" | cut -c1-500
            echo 'RB_DIAGNOSTIC_EOF'
          } >> "$GITHUB_OUTPUT"
          if [ "$status" != '0' ]; then
            echo 'FitHub homologation failed; diagnostic job will print the concise tail.'
          fi
          exit "$status"

  diagnostic:
    needs: validate
    if: always() && needs.validate.outputs.homologation_status != '0'
    runs-on: ubuntu-latest
    steps:
      - name: FitHub failure details
        env:
          DIAGNOSTIC: ${{ needs.validate.outputs.homologation_tail }}
        run: |
          printf '%s\n' "$DIAGNOSTIC"
          exit 1

  windows:
    if: github.head_ref == 'agent/v2-standalone-supabase'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-standalone-supabase
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: rb-project-bridge-v2-windows
          path: release/*
          if-no-files-found: error
          retention-days: 30
