name: Validate V2 standalone Supabase

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  prepare:
    if: github.head_ref == 'agent/v2-standalone-supabase'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-standalone-supabase
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and test RB Project Bridge
        run: |
          npm install --no-audit --no-fund --loglevel=error
          npm run check
      - name: Clone complete FitHub source
        run: git clone --depth 1 --branch main https://github.com/rennanbrasileiro/fithub.git fixture-fithub
      - name: Convert complete FitHub source
        shell: bash
        run: |
          node - <<'NODE'
          const { StandaloneService } = require('./electron/services/standalone-service.cjs');
          const service = new StandaloneService({ logger: { info(){}, warn(){} }, emit(){} });
          service.transform('fixture-fithub', { projectName: 'FitHub Personal Trainer' })
            .then((result) => {
              console.log(`Converted entities: ${result.entities?.length || 0}`);
              console.log(`Preserved functions: ${result.functions?.length || 0}`);
              console.log(`Production blockers: ${result.blockers?.length || 0}`);
              if (!Array.isArray(result.entities) || result.entities.length < 20) throw new Error('FitHub entity conversion is incomplete.');
              if (!result.gate?.passed) throw new Error('Base44 runtime dependencies remain.');
            })
            .catch((error) => { console.error(error); process.exit(1); });
          NODE
      - name: Install and audit transformed FitHub
        working-directory: fixture-fithub
        run: |
          npm install --no-audit --no-fund --loglevel=error
          npm run check:standalone
      - name: Prepare transformed source artifact
        shell: bash
        run: |
          rm -rf fixture-fithub/node_modules fixture-fithub/.git fixture-fithub/dist
      - uses: actions/upload-artifact@v4
        with:
          name: fithub-standalone-source
          path: fixture-fithub
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  build-demo:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fithub-standalone-source
          path: fixture-fithub
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install transformed dependencies
        working-directory: fixture-fithub
        run: npm ci --no-audit --no-fund --loglevel=error
      - name: Build FitHub local demo
        working-directory: fixture-fithub
        shell: bash
        run: |
          set +e
          npm run build:demo > build.log 2>&1
          status=$?
          cat build.log
          exit "$status"
      - name: Verify local preview artifact
        shell: bash
        run: test -f fixture-fithub/dist/index.html

  windows:
    if: github.head_ref == 'agent/v2-standalone-supabase'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-standalone-supabase
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --loglevel=error
      - run: npm run check
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: rb-project-bridge-v2-windows
          path: release/*
          if-no-files-found: error
          retention-days: 30
