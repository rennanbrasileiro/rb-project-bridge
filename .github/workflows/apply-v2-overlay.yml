name: Validate V2 standalone Supabase

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/v2-standalone-supabase'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-standalone-supabase
          fetch-depth: 0
      - name: Apply generic Vite alias preservation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          service = Path('electron/services/standalone-service.cjs')
          source = service.read_text()
          old = """      let source = await fs.readFile(file, 'utf8');
                source = source.split(/\\r?\\n/).filter((line) => !line.includes('@base44/vite-plugin')).join('\\n');
                source = removeFunctionCall(source, 'base44');
                await fs.writeFile(file, `${source.trim()}\\n`, 'utf8');
                return candidate;
          """
          new = """      let source = await fs.readFile(file, 'utf8');
                source = source.split(/\\r?\\n/).filter((line) => !line.includes('@base44/vite-plugin')).join('\\n');
                source = removeFunctionCall(source, 'base44');
                if (!/from\\s+['\"]node:path['\"]/.test(source)) source = `import path from 'node:path';\\n${source}`;
                if (!/alias\\s*:\\s*\\{[\\s\\S]*?['\"]?@['\"]?\\s*:/.test(source)) {
                  if (/defineConfig\\s*\\(\\s*\\{/.test(source)) {
                    source = source.replace(/defineConfig\\s*\\(\\s*\\{/, "defineConfig({\\n  resolve: { alias: { '@': path.resolve(process.cwd(), 'src') } },");
                  } else {
                    source = `import react from '@vitejs/plugin-react';\\nimport { defineConfig } from 'vite';\\nimport path from 'node:path';\\n\\nexport default defineConfig({\\n  resolve: { alias: { '@': path.resolve(process.cwd(), 'src') } },\\n  plugins: [react()],\\n});\\n`;
                  }
                }
                await fs.writeFile(file, `${source.trim()}\\n`, 'utf8');
                return candidate;
          """
          if old in source:
              service.write_text(source.replace(old, new))
          elif "path.resolve(process.cwd(), 'src')" not in source:
              raise SystemExit('Vite update block was not found')

          tests = Path('tests/standalone.test.cjs')
          test_source = tests.read_text()
          old_test = "  assert.doesNotMatch(await fs.readFile(path.join(root, 'vite.config.js'), 'utf8'), /base44/);\n"
          new_test = "  const viteConfig = await fs.readFile(path.join(root, 'vite.config.js'), 'utf8');\n  assert.doesNotMatch(viteConfig, /base44/);\n  assert.match(viteConfig, /alias:[\\s\\S]*['\"]@['\"]:[\\s\\S]*path\\.resolve\\(process\\.cwd\\(\\), ['\"]src['\"]\\)/);\n"
          if old_test in test_source:
              tests.write_text(test_source.replace(old_test, new_test))
          elif 'const viteConfig =' not in test_source:
              raise SystemExit('Vite test assertion was not found')
          PY
          git config user.name 'RB Project Bridge Bot'
          git config user.email 'rennanbrasileiro@users.noreply.github.com'
          git add electron/services/standalone-service.cjs tests/standalone.test.cjs
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve Vite source alias during Base44 removal'
            git push origin HEAD:agent/v2-standalone-supabase
          fi

  prepare:
    needs: patch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-standalone-supabase
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and test RB Project Bridge
        run: |
          npm install --no-audit --no-fund --loglevel=error
          npm run check
      - name: Clone complete FitHub source
        run: git clone --depth 1 --branch main https://github.com/rennanbrasileiro/fithub.git fixture-fithub
      - name: Convert complete FitHub source
        shell: bash
        run: |
          node - <<'NODE'
          const { StandaloneService } = require('./electron/services/standalone-service.cjs');
          const service = new StandaloneService({ logger: { info(){}, warn(){} }, emit(){} });
          service.transform('fixture-fithub', { projectName: 'FitHub Personal Trainer' })
            .then((result) => {
              console.log(`Converted entities: ${result.entities?.length || 0}`);
              console.log(`Preserved functions: ${result.functions?.length || 0}`);
              console.log(`Production blockers: ${result.blockers?.length || 0}`);
              if (!Array.isArray(result.entities) || result.entities.length < 20) throw new Error('FitHub entity conversion is incomplete.');
              if (!result.gate?.passed) throw new Error('Base44 runtime dependencies remain.');
            })
            .catch((error) => { console.error(error); process.exit(1); });
          NODE
      - name: Install and audit transformed FitHub
        working-directory: fixture-fithub
        run: |
          npm install --no-audit --no-fund --loglevel=error
          npm run check:standalone
      - name: Prepare transformed source artifact
        shell: bash
        run: rm -rf fixture-fithub/node_modules fixture-fithub/.git fixture-fithub/dist
      - uses: actions/upload-artifact@v4
        with:
          name: fithub-standalone-source
          path: fixture-fithub
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  build-demo:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fithub-standalone-source
          path: fixture-fithub
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install transformed dependencies
        working-directory: fixture-fithub
        run: npm ci --no-audit --no-fund --loglevel=error
      - name: Build FitHub local demo
        working-directory: fixture-fithub
        run: npm run build:demo
      - name: Verify local preview artifact
        shell: bash
        run: test -f fixture-fithub/dist/index.html

  windows:
    needs: patch
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-standalone-supabase
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --loglevel=error
      - run: npm run check
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: rb-project-bridge-v2-windows
          path: release/*
          if-no-files-found: error
          retention-days: 30
