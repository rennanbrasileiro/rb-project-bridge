name: Validate V2 standalone Supabase

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'agent/v2-standalone-supabase'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-standalone-supabase
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Homologate complete FitHub conversion and local build
        id: homologate
        continue-on-error: true
        shell: bash
        run: |
          set +e
          LOG="$RUNNER_TEMP/homologation.log"
          EXIT_FILE="$RUNNER_TEMP/homologation.exit"
          {
            git clone --depth 1 --branch main https://github.com/rennanbrasileiro/fithub.git fixture-fithub
            node - <<'NODE'
            const { StandaloneService } = require('./electron/services/standalone-service.cjs');
            const service = new StandaloneService({ logger: { info(){}, warn(){} }, emit(){} });
            service.transform('fixture-fithub', { projectName: 'FitHub Personal Trainer' })
              .then((result) => {
                console.log(JSON.stringify(result, null, 2));
                if (result.entitiesConverted < 20) throw new Error('FitHub entity conversion is incomplete.');
                if (!result.independence?.passed) throw new Error('Base44 runtime dependencies remain.');
              })
              .catch((error) => { console.error(error); process.exit(1); });
            NODE
            cd fixture-fithub
            npm install --no-audit --no-fund
            npm run check:standalone
            npm run build:demo
            test -f dist/index.html
          } > "$LOG" 2>&1
          status=$?
          echo "$status" > "$EXIT_FILE"
          tail -n 80 "$LOG"
          exit 0
      - name: Persist temporary failure diagnostic
        if: always()
        shell: bash
        run: |
          status="$(cat "$RUNNER_TEMP/homologation.exit" 2>/dev/null || echo 99)"
          if [ "$status" != '0' ]; then
            mkdir -p docs
            {
              echo 'FitHub V2 homologation failure'
              echo 'Commit: ${{ github.sha }}'
              echo 'Exit code: '$status
              echo
              tail -c 12000 "$RUNNER_TEMP/homologation.log"
            } > docs/FITHUB_HOMOLOGATION_FAILURE.txt
            git config user.name 'RB Project Bridge Bot'
            git config user.email 'rennanbrasileiro@users.noreply.github.com'
            git add docs/FITHUB_HOMOLOGATION_FAILURE.txt
            if ! git diff --cached --quiet; then
              git commit -m 'Record temporary FitHub homologation diagnostic'
              git push origin HEAD:agent/v2-standalone-supabase
            fi
          fi
      - name: Enforce FitHub homologation result
        shell: bash
        run: |
          test -f "$RUNNER_TEMP/homologation.exit"
          test "$(cat "$RUNNER_TEMP/homologation.exit")" = '0'

  windows:
    if: github.head_ref == 'agent/v2-standalone-supabase'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-standalone-supabase
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: rb-project-bridge-v2-windows
          path: release/*
          if-no-files-found: error
          retention-days: 30
