name: Validate V2 standalone Supabase

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write

jobs:
  validate:
    if: github.head_ref == 'agent/v2-standalone-supabase'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-standalone-supabase
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Homologate complete FitHub conversion and local build
        id: homologate
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -o pipefail
          LOG="$RUNNER_TEMP/homologation.log"
          EXIT_FILE="$RUNNER_TEMP/homologation.exit"
          {
            git clone --depth 1 --branch main https://github.com/rennanbrasileiro/fithub.git fixture-fithub
            node - <<'NODE'
            const { StandaloneService } = require('./electron/services/standalone-service.cjs');
            const service = new StandaloneService({ logger: { info(){}, warn(){} }, emit(){} });
            service.transform('fixture-fithub', { projectName: 'FitHub Personal Trainer' })
              .then((result) => {
                console.log(JSON.stringify(result, null, 2));
                if (result.entitiesConverted < 20) throw new Error('FitHub entity conversion is incomplete.');
                if (!result.independence?.passed) throw new Error('Base44 runtime dependencies remain.');
              })
              .catch((error) => { console.error(error); process.exit(1); });
            NODE
            cd fixture-fithub
            npm install --no-audit --no-fund
            npm run check:standalone
            npm run build:demo
            test -f dist/index.html
          } > "$LOG" 2>&1
          status=$?
          echo "$status" > "$EXIT_FILE"
          echo '--- FitHub homologation tail ---'
          tail -n 100 "$LOG"
          exit 0
      - name: Publish concise diagnostic issue
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(cat "$RUNNER_TEMP/homologation.exit" 2>/dev/null || echo 99)"
          if [ "$status" != '0' ]; then
            {
              echo '## FitHub V2 homologation failure'
              echo
              echo '- Commit: `${{ github.sha }}`'
              echo '- Exit code: `'$status'`'
              echo
              echo '```text'
              tail -n 100 "$RUNNER_TEMP/homologation.log"
              echo '```'
            } > "$RUNNER_TEMP/failure.md"
            gh issue create --repo rennanbrasileiro/rb-project-bridge --title 'Diagnostic — FitHub V2 homologation failure' --body-file "$RUNNER_TEMP/failure.md"
          fi
      - name: Enforce FitHub homologation result
        shell: bash
        run: |
          test -f "$RUNNER_TEMP/homologation.exit"
          test "$(cat "$RUNNER_TEMP/homologation.exit")" = '0'

  windows:
    if: github.head_ref == 'agent/v2-standalone-supabase'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v2-standalone-supabase
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: rb-project-bridge-v2-windows
          path: release/*
          if-no-files-found: error
          retention-days: 30
