name: Promote clean source tree

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/promote-clean-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Promote complete source tree to main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_SHA: ${{ github.sha }}
          CLEAN_TREE_SHA: c6a2cb6fee12f965c1a5aeb99253dd989b520973
        shell: bash
        run: |
          set -euo pipefail

          payload=$(jq -n \
            --arg message "Publish RB Project Bridge 0.1.1 source" \
            --arg tree "$CLEAN_TREE_SHA" \
            --arg parent "$CURRENT_SHA" \
            '{message: $message, tree: $tree, parents: [$parent]}')

          response=$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/git/commits" \
            -d "$payload")

          commit_sha=$(jq -r '.sha // empty' <<<"$response")
          if [[ -z "$commit_sha" ]]; then
            echo "$response"
            exit 1
          fi

          ref_payload=$(jq -n --arg sha "$commit_sha" '{sha: $sha, force: false}')
          curl --fail-with-body --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/git/refs/heads/main" \
            -d "$ref_payload"

          echo "Promoted clean source commit: $commit_sha"
