name: Patch standalone gate false positive

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/fix-standalone-gate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-standalone-gate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch gate, diagnostics and regression tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          service_path = Path('electron/services/standalone-service.cjs')
          source = service_path.read_text(encoding='utf-8')

          helper = r'''
function isArchivedBase44Source(root, file) {
  const relative = path.relative(root, file).replaceAll('\\', '/');
  return /^supabase\/functions\/.+\/source\.base44\.(js|jsx|ts|tsx|mjs|cjs)$/i.test(relative);
}
'''
          if 'function isArchivedBase44Source' not in source:
              source = source.replace('\nfunction standaloneClientSource(entityMap) {', helper + '\nfunction standaloneClientSource(entityMap) {')

          verification = r'''function verificationScriptSource() {
  return `import fs from 'node:fs';\nimport path from 'node:path';\nconst root = process.cwd();\nconst ignored = new Set(['node_modules','.git','dist','build','coverage']);\nconst failures = [];\nfunction isArchived(file) { const relative=path.relative(root,file).replaceAll('\\\\','/'); return /^supabase\\/functions\\/.+\\/source\\.base44\\.(js|jsx|ts|tsx|mjs|cjs)$/i.test(relative); }\nfunction walk(dir) { for (const entry of fs.readdirSync(dir,{withFileTypes:true})) { if (ignored.has(entry.name)) continue; const file = path.join(dir,entry.name); if (entry.isDirectory()) walk(file); else if (/\\.(js|jsx|ts|tsx|json|jsonc|mjs|cjs)$/.test(entry.name)) { if (isArchived(file)) continue; const text=fs.readFileSync(file,'utf8'); if (/@base44\\/(sdk|vite-plugin)|from ['\"]base44['\"]/.test(text)) failures.push(path.relative(root,file)); } } }\nwalk(root);\nconst packageJson=JSON.parse(fs.readFileSync(path.join(root,'package.json'),'utf8'));\nfor (const name of Object.keys({...packageJson.dependencies,...packageJson.devDependencies})) if (name === 'base44' || name.startsWith('@base44/')) failures.push('package.json:' + name);\nif (!fs.existsSync(path.join(root,'supabase','config.toml'))) failures.push('supabase/config.toml missing');\nif (!fs.existsSync(path.join(root,'.env.example'))) failures.push('.env.example missing');\nif (failures.length) { console.error('Standalone gate failed:', failures); process.exit(1); }\nconsole.log('Standalone gate passed: zero Base44 runtime dependencies.');\n`;
}

'''
          source, count = re.subn(r'function verificationScriptSource\(\) \{.*?\n\}\n\nfunction workflowSource\(\)', verification + 'function workflowSource()', source, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not replace verificationScriptSource')

          old_loop = '''    for (const file of files) {
      if (!/\\.(js|jsx|ts|tsx|mjs|cjs|json)$/i.test(file)) continue;
      const text = await fs.readFile(file, 'utf8').catch(() => '');
      if (/@base44\\/(sdk|vite-plugin)|from\\s+['"]base44['"]/.test(text)) violations.push(path.relative(root, file));
    }'''
          new_loop = '''    for (const file of files) {
      if (!/\\.(js|jsx|ts|tsx|mjs|cjs|json)$/i.test(file)) continue;
      if (isArchivedBase44Source(root, file)) continue;
      const text = await fs.readFile(file, 'utf8').catch(() => '');
      if (/@base44\\/(sdk|vite-plugin)|from\\s+['"]base44['"]/.test(text)) violations.push(path.relative(root, file));
    }'''
          if old_loop not in source:
              raise SystemExit('Could not find verify loop')
          source = source.replace(old_loop, new_loop, 1)
          source = source.replace("if (violations.length) throw new BridgeError('STANDALONE_GATE_FAILED', 'A aplicação ainda possui dependências Base44 ou arquivos obrigatórios ausentes.', { violations });", "if (violations.length) throw new BridgeError('STANDALONE_GATE_FAILED', `A aplicação ainda possui dependências Base44 ou arquivos obrigatórios ausentes: ${violations.slice(0, 8).join(', ')}${violations.length > 8 ? '…' : ''}`, { violations });")
          source = source.replace('  removeFunctionCall,\n};', '  removeFunctionCall,\n  isArchivedBase44Source,\n};')
          service_path.write_text(source, encoding='utf-8')

          test_path = Path('tests/standalone.test.cjs')
          tests = test_path.read_text(encoding='utf-8')
          tests = tests.replace('buildEntitySql, removeFunctionCall }', 'buildEntitySql, removeFunctionCall, isArchivedBase44Source }')
          tests = tests.replace("await fs.writeFile(path.join(root, 'base44', 'functions', 'hello', 'entry.ts'), 'export default async function handler(request, context) { return context.base44.auth.me(); }');", "await fs.writeFile(path.join(root, 'base44', 'functions', 'hello', 'entry.ts'), \"import { createClient } from '@base44/sdk';\\nexport default async function handler(request, context) { return context.base44.auth.me(); }\");")
          marker = "test('33 preview service serves SPA fallback from generated dist', async () => {"
          regression = r'''test('33 ignores archived Base44 function sources but still blocks active runtime imports', async () => {
  const root = await fs.mkdtemp(path.join(os.tmpdir(), 'rb-standalone-archive-'));
  const archived = path.join(root, 'supabase', 'functions', 'hello', 'source.base44.ts');
  await fs.mkdir(path.dirname(archived), { recursive: true });
  await fs.mkdir(path.join(root, 'src'), { recursive: true });
  await fs.mkdir(path.join(root, 'scripts'), { recursive: true });
  await fs.writeFile(archived, "import { createClient } from '@base44/sdk';");
  await fs.writeFile(path.join(root, 'package.json'), JSON.stringify({ dependencies: {} }));
  await fs.writeFile(path.join(root, 'supabase', 'config.toml'), 'project_id = "test"');
  await fs.writeFile(path.join(root, '.env.example'), 'VITE_SUPABASE_URL=');
  await fs.mkdir(path.join(root, 'src', 'api'), { recursive: true });
  await fs.writeFile(path.join(root, 'src', 'api', 'base44Client.js'), 'export const base44 = {};');
  await fs.writeFile(path.join(root, 'scripts', 'verify-standalone.mjs'), 'console.log("ok")');
  const service = new StandaloneService({ logger, emit });
  assert.equal(isArchivedBase44Source(root, archived), true);
  assert.equal((await service.verify(root)).passed, true);
  await fs.writeFile(path.join(root, 'src', 'active.js'), "import x from '@base44/sdk';");
  await assert.rejects(() => service.verify(root), (error) => error.code === 'STANDALONE_GATE_FAILED' && error.details.violations.some((item) => item.includes('active.js')));
  await fs.rm(root, { recursive: true, force: true });
});

test('34 preview service serves SPA fallback from generated dist', async () => {'''
          if marker not in tests:
              raise SystemExit('Could not find preview test marker')
          tests = tests.replace(marker, regression, 1)
          test_path.write_text(tests, encoding='utf-8')

          renderer_path = Path('renderer/app.js')
          renderer = renderer_path.read_text(encoding='utf-8')
          old = "} catch (error) { setResult(error.message, 'error'); log(`ERRO: ${error.message}`); } finally { $('start').disabled = false; }"
          new = "} catch (error) { const violations = error.details?.violations || []; const suffix = violations.length ? `\\nViolações detectadas:\\n- ${violations.join('\\n- ')}` : ''; setResult(error.message, 'error'); log(`ERRO: ${error.message}${suffix}`); } finally { $('start').disabled = false; }"
          if old not in renderer:
              raise SystemExit('Could not find renderer catch block')
          renderer_path.write_text(renderer.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add electron/services/standalone-service.cjs tests/standalone.test.cjs renderer/app.js
          if git diff --cached --quiet; then
            echo 'Patch already applied.'
          else
            git commit -m 'Fix standalone gate false positive for archived Base44 sources'
            git push origin HEAD:agent/fix-standalone-gate
          fi
